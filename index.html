<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
  <title>Voice Input Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Voice input</h1>
      <p class="sub">Speech-to-text in the browser with the Web Speech API. Built for Safari on iPhone.</p>
    </header>

    <section class="card" aria-live="polite">
      <div id="status" class="status" data-state="idle">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Tap the mic to start</span>
      </div>

      <div id="transcript" class="transcript" data-empty="true">
        <span id="final"></span><span id="interim" class="interim"></span>
        <span class="placeholder">Your words will show up here as you speak.</span>
      </div>

      <div id="error" class="error" role="alert" hidden>
        <strong id="error-title"></strong>
        <p id="error-body"></p>
      </div>
    </section>

    <div class="controls">
      <button id="mic" class="mic" type="button" aria-label="Start listening" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-mic">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/>
          <path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V20H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-2.07A7 7 0 0 0 19 11Z"/>
        </svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-stop">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
      </button>
      <div class="secondary">
        <button id="copy" type="button" disabled>Copy</button>
        <button id="clear" type="button" disabled>Clear</button>
      </div>
    </div>

    <details class="log">
      <summary>Event log</summary>
      <p class="hint">Raw recognition events in order. Useful for seeing how Safari behaves on a real device.</p>
      <ol id="log"></ol>
    </details>

    <footer>
      <a href="https://github.com/pushtishah11/voice-input-demo">Source &amp; write-up</a>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
